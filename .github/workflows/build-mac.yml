name: Build macOS DMG

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-dmg:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Ou 9.0.x selon la version utilisée dans votre .csproj

    - name: Install packaging tools
      run: brew install create-dmg

    - name: Publish .NET App (GestionCommerciale)
      run: |
        dotnet publish GestionCommerciale.csproj -c Release -r osx-arm64 --self-contained true /p:PublishSingleFile=true -o ./publish/arm64

    - name: Construct .app Bundle
      run: |
        APP_DIR="build/Kahuzi-ERP.app"
        mkdir -p "$APP_DIR/Contents/MacOS"
        mkdir -p "$APP_DIR/Contents/Resources"
        
        # Copie des fichiers compilés dans le bundle Mac
        cp -a ./publish/arm64/. "$APP_DIR/Contents/MacOS/"
        
        # Génération d'un Info.plist minimal
        cat <<EOF > "$APP_DIR/Contents/Info.plist"
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>GestionCommerciale</string>
            <key>CFBundleIdentifier</key>
            <string>com.meganae.kahuzierp</string>
            <key>CFBundleName</key>
            <string>Kahuzi-ERP</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.15</string>
        </dict>
        </plist>
        EOF
        
        chmod +x "$APP_DIR/Contents/MacOS/GestionCommerciale"

    - name: Create DMG
      run: |
        mkdir -p dist
        create-dmg \
          --volname "Kahuzi-ERP Installer" \
          --window-size 600 400 \
          --icon "Kahuzi-ERP.app" 175 120 \
          --app-drop-link 425 120 \
          "dist/Kahuzi-ERP-macOS-ARM64.dmg" \
          "build/Kahuzi-ERP.app"

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kahuzi-ERP-macOS-DMG
        path: dist/*.dmg
